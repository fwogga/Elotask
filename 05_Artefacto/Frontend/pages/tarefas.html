<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarefas · EloTask</title>
  <link rel="icon" href="../assets/img/logo-elotask.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/pages/tarefas.css">

  <script type="module" src="../js/comum.js"></script>
  <script type="module" src="../js/pages/tarefas.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" data-sidebar data-ativo="tarefas"></aside>

    <main class="conteudo conteudo--tarefas">
      <header class="cabecalho-pagina">
        <h1 class="titulo-pagina">Tarefas</h1>
        <form class="pesquisa pesquisa--contorno pesquisa--larga" role="search" data-pesquisa>
          <img src="../assets/icons/search.svg" alt="" width="26" height="26">
          <label class="sr-only" for="pesquisa">Pesquisar tarefas</label>
          <input id="pesquisa" type="search" placeholder="Pesquisar tarefas...">
        </form>
        <button class="botao" type="button" data-nova-tarefa data-abrir="nova-tarefa">
          <img src="../assets/icons/plus.svg" alt="" width="26" height="26">
          Nova tarefa
        </button>
      </header>

      <div class="filtros">
        <label class="sr-only" for="filtro-projeto">Filtrar por projeto</label>
        <select class="filtro" id="filtro-projeto" data-filtro="projeto">
          <option value="">Projeto: Todos</option>
        </select>
        <label class="sr-only" for="filtro-responsavel">Filtrar por responsável</label>
        <select class="filtro" id="filtro-responsavel" data-filtro="responsavel">
          <option value="">Responsável: Todos</option>
        </select>
        <label class="sr-only" for="filtro-prioridade">Filtrar por prioridade</label>
        <select class="filtro" id="filtro-prioridade" data-filtro="prioridade">
          <option value="">Prioridade: Todos</option>
          <option value="alta">Prioridade: Alta</option>
          <option value="media">Prioridade: Média</option>
          <option value="baixa">Prioridade: Baixa</option>
        </select>
      </div>

      <div class="quadro">
        <section class="coluna" data-estado="por_fazer" aria-labelledby="coluna-por-fazer">
          <h2 class="coluna__titulo" id="coluna-por-fazer">Por fazer <span data-contagem></span></h2>
          <ul class="coluna__lista" data-lista></ul>
        </section>
        <section class="coluna coluna--progresso" data-estado="em_progresso" aria-labelledby="coluna-em-progresso">
          <h2 class="coluna__titulo" id="coluna-em-progresso">Em progresso <span data-contagem></span></h2>
          <ul class="coluna__lista" data-lista></ul>
        </section>
        <section class="coluna coluna--concluida" data-estado="concluida" aria-labelledby="coluna-concluidas">
          <h2 class="coluna__titulo" id="coluna-concluidas">Concluídas <span data-contagem></span></h2>
          <ul class="coluna__lista" data-lista></ul>
        </section>
      </div>
    </main>
  </div>

  <dialog class="dialogo" data-dialogo-tarefa aria-labelledby="dialogo-tarefa-titulo">
    <form class="formulario" method="dialog" novalidate data-form-tarefa>
      <h2 class="dialogo__titulo formulario__total" id="dialogo-tarefa-titulo">Nova tarefa</h2>

      <div class="campo formulario__total">
        <label for="tarefa-titulo">Título *</label>
        <input id="tarefa-titulo" name="titulo" type="text" maxlength="120" aria-describedby="erro-tarefa-titulo">
        <p class="campo__erro" id="erro-tarefa-titulo"></p>
      </div>

      <div class="campo">
        <label for="tarefa-projeto">Projeto *</label>
        <select id="tarefa-projeto" name="projetoId" aria-describedby="erro-tarefa-projeto"></select>
        <p class="campo__erro" id="erro-tarefa-projeto"></p>
      </div>

      <div class="campo">
        <label for="tarefa-prazo">Data-limite *</label>
        <input id="tarefa-prazo" name="prazo" type="date" aria-describedby="erro-tarefa-prazo">
        <p class="campo__erro" id="erro-tarefa-prazo"></p>
      </div>

      <div class="campo">
        <label for="tarefa-prioridade">Prioridade</label>
        <select id="tarefa-prioridade" name="prioridade">
          <option value="alta">Alta</option>
          <option value="media" selected>Média</option>
          <option value="baixa">Baixa</option>
        </select>
      </div>

      <div class="campo">
        <label for="tarefa-estado">Estado</label>
        <select id="tarefa-estado" name="estado">
          <option value="por_fazer">Por fazer</option>
          <option value="em_progresso">Em progresso</option>
          <option value="concluida">Concluída</option>
        </select>
      </div>

      <fieldset class="campo formulario__total" aria-describedby="erro-tarefa-responsaveis">
        <legend class="campo__rotulo">Responsáveis *</legend>
        <div class="escolhas" data-responsaveis></div>
        <p class="campo__erro" id="erro-tarefa-responsaveis"></p>
      </fieldset>

      <div class="dialogo__acoes formulario__total">
        <button class="botao-texto botao--perigo-texto" type="button" data-apagar hidden>Apagar tarefa</button>
        <button class="botao botao--secundario" type="button" data-cancelar>Cancelar</button>
        <button class="botao" type="submit">Guardar</button>
      </div>
    </form>
  </dialog>
</body>
</html>
