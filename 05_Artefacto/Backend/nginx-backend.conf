# Balanceador do backend: o frontend fala sempre com ele, nunca com um servidor diretamente.
#   8081 -> servidor do PC (3000) e contentor "servidor"
#   3306 (só dentro do Docker) -> base de dados do Docker, com a do PC (MAMP) de reserva
# Se uma cópia falhar, os pedidos passam para a outra.

events {}

http {
    resolver 127.0.0.11 valid=5s;
    client_max_body_size 50m;

    # ip_hash: o mesmo browser fica sempre no mesmo servidor (preciso para o Socket.IO)
    upstream servidor {
        zone servidor 64k;
        ip_hash;
        server servidor:3000 resolve max_fails=1 fail_timeout=10s;
        server host.docker.internal:3000 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 8081;
        location / {
            proxy_pass http://servidor;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_connect_timeout 2s;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}

stream {
    resolver 127.0.0.11 valid=5s;

    upstream base_dados {
        zone base_dados 64k;
        server db:3306 resolve max_fails=1 fail_timeout=10s;
        server host.docker.internal:3306 backup;
    }

    server {
        listen 3306;
        proxy_pass base_dados;
        proxy_connect_timeout 2s;
    }
}
