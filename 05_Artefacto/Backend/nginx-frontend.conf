# Balanceador do frontend (porta 8080): reparte as páginas pelas duas cópias.
#   -> frontend do PC (5501, aberto pelo iniciar.bat) e contentor "frontend"
# Se uma cópia falhar, os pedidos passam para a outra.

events {}

http {
    resolver 127.0.0.11 valid=5s;

    upstream frontend {
        zone frontend 64k;
        server frontend:80 resolve max_fails=1 fail_timeout=10s;
        server host.docker.internal:5501 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;
        location / {
            proxy_pass http://frontend;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_connect_timeout 2s;
        }
    }
}
