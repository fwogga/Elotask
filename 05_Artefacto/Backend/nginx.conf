# Porta de entrada única: reparte os pedidos pelas duas cópias de cada backend.
# Se uma cópia for abaixo, o nginx passa a mandar tudo para a outra.

events {}

http {
    upstream principal {
        server principal1:3000 max_fails=1 fail_timeout=10s;
        server principal2:3000 max_fails=1 fail_timeout=10s;
    }

    # ip_hash: o mesmo browser fica sempre na mesma cópia (preciso para o Socket.IO)
    upstream comunicacao {
        ip_hash;
        server comunicacao1:3002 max_fails=1 fail_timeout=10s;
        server comunicacao2:3002 max_fails=1 fail_timeout=10s;
    }

    client_max_body_size 50m;

    server {
        listen 3000;
        location / {
            proxy_pass http://principal;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 3002;
        location / {
            proxy_pass http://comunicacao;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
