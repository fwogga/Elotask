<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Início · EloTask</title>
  <link rel="icon" href="../assets/img/logo-elotask.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/pages/dashboard.css">

  <script type="module" src="../js/comum.js"></script>
  <script type="module" src="../js/pages/dashboard.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" data-sidebar data-ativo="inicio"></aside>

    <main class="conteudo">
      <header class="barra-topo">
        <form class="pesquisa" role="search">
          <img src="../assets/icons/search.svg" alt="" width="24" height="24">
          <label class="sr-only" for="pesquisa">Pesquisar</label>
          <input id="pesquisa" type="search" placeholder="Pesquisar...">
        </form>
        <button class="botao-icone" type="button" aria-label="Notificações">
          <img src="../assets/icons/bell.svg" alt="" width="40" height="40">
        </button>
      </header>

      <section class="saudacao">
        <h1 class="titulo-pagina">Olá, <span data-primeiro-nome></span>! 👋</h1>
        <p class="saudacao__subtitulo">Aqui está um resumo do teu trabalho.</p>
      </section>

      <section aria-label="Resumo">
        <ul class="grelha-4 estatisticas" data-estatisticas></ul>
      </section>

      <section class="seccao">
        <div class="seccao__cabecalho">
          <h2 class="seccao__titulo">Os teus projetos</h2>
          <a class="link" href="projetos.html">Ver todos</a>
        </div>
        <ul class="grelha-4" data-projetos></ul>
      </section>

      <div class="dashboard-fundo">
        <section class="seccao">
          <div class="seccao__cabecalho">
            <h2 class="seccao__titulo">Tarefas recentes</h2>
            <a class="link" href="tarefas.html">Ver todas</a>
          </div>
          <ul class="cartao lista" data-tarefas></ul>
        </section>

        <section class="seccao">
          <div class="seccao__cabecalho">
            <h2 class="seccao__titulo">Próximas reuniões</h2>
            <a class="link" href="reunioes.html">Ver todas</a>
          </div>
          <ul class="cartao lista reunioes" data-reunioes></ul>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
